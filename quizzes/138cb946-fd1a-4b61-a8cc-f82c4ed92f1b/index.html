    <script type='module'>
      import form from '../dist/138cb946-fd1a-4b61-a8cc-f82c4ed92f1b/quiz.js?v=54076e5732'

      const documentItem = jsonDom.documentItem
      // Capture the hand-authored page into items once, then render the quiz into its container (as /projects/ does
      // with its grid), so the page around it stays. A second full-tree pass throws in a real browser. The quizzes
      // bundle's JSON DOM predates getItemByElement, and #quiz is a child of <body>, so it's found among those.
      jsonDom.updateDomItems(documentItem)
      const quizElement = document.getElementById('quiz')
      const quizItem = documentItem.body.children.find(item => item.element === quizElement)
      // The page's original sequence, aimed at the container instead of <body>: set its children, then build them
      quizItem.children = form()
      jsonDom.updateChildNodes(quizItem)
      jsonDom.updateElements(quizItem)
    </script>
</head>
