<!DOCTYPE html>
<html lang="en-CA">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Sí, funciona | Joshua Heagle</title>
    <link rel="preload" href="/browser/fonts/atkinson-hyperlegible-next-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/browser/fonts/lexend-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/browser/tailwind/site.css">
    <script src="./browser/siFunciona.js"></script>
</head>
<body class="mx-auto max-w-3xl px-5 pt-6 pb-16 lg:pt-14">
<div>
    <a class="mb-5 inline-block font-heading" href="/projects/">&larr; Back to projects</a>
    <div class="mb-6 border-b border-rule pb-4">
        <h1 class="m-0 mb-1.5 text-4xl/tight tracking-tight lg:text-5xl">Sí, funciona</h1>
        <p class="m-0 text-muted">Dependency-light, fully-typed general-purpose utility functions - arrays, objects, strings, functions,
            numbers.</p>
    </div>
    <nav class="my-5 flex flex-wrap gap-2.5" aria-label="Project links">
        <a class="rounded-lg bg-accent px-4 py-2 font-heading font-semibold text-background no-underline hover:opacity-90" href="./docs/">Documentation</a>
        <a class="rounded-lg border border-rule px-4 py-2 font-heading text-foreground no-underline hover:border-accent hover:text-accent" href="https://github.com/jheagle/si-funciona" target="_blank">View on GitHub</a>
        <a class="rounded-lg border border-rule px-4 py-2 font-heading text-foreground no-underline hover:border-accent hover:text-accent" href="#demo">Try the demo</a>
    </nav>
    <p class="text-muted">Try the string-case helpers below, or open the console to use <code class="rounded bg-foreground/8 px-1 py-px">siFunciona</code>
        directly.</p>

    <div class="mt-7 rounded-lg border border-rule bg-foreground/4 p-5 md:p-6" id="demo">
        <h2 class="mt-0 mb-3 text-xl">String case conversion</h2>
        <label class="mb-1 block text-sm text-muted" for="case-input">Type something</label>
        <input class="box-border w-full rounded-md border border-rule bg-background px-2.5 py-2 font-sans text-base text-foreground" id="case-input" type="text" value="some-kabob-case example" autocomplete="off">
        <div class="mt-3.5">
            <pre class="m-0 overflow-x-auto rounded-md bg-foreground/8 p-4 text-sm" id="case-output"></pre>
        </div>
    </div>
</div>
<script type="module">
  const { camelCase, kabobCase, snakeCase, titleCase } = siFunciona
  const input = document.getElementById('case-input')
  const output = document.getElementById('case-output')

  const render = () => {
    const value = input.value
    output.textContent = [
      `camelCase: ${camelCase(value)}`,
      `kabobCase: ${kabobCase(value)}`,
      `snakeCase: ${snakeCase(value)}`,
      `titleCase: ${titleCase(value)}`
    ].join('\n')
  }

  input.addEventListener('input', render)
  window.addEventListener('DOMContentLoaded', () => {
    render()
    console.log(siFunciona, 'Sí, funciona')
  })
</script>
</body>
</html>
