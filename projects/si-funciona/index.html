<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Sí, funciona | Joshua Heagle</title>
    <link rel="stylesheet" href="../shared.css">
    <script src="./browser/siFunciona.js"></script>
</head>
<body>
<div class="page">
    <a class="back-link" href="../">&larr; Back to projects</a>
    <div class="project-header">
        <h1>Sí, funciona</h1>
        <p>Dependency-light, fully-typed general-purpose utility functions - arrays, objects, strings, functions,
            numbers.</p>
    </div>
    <div class="actions">
        <a class="primary" href="https://github.com/jheagle/si-funciona" target="_blank">View on GitHub</a>
        <a href="./docs">Documentation</a>
    </div>
    <p class="hint">Try the string-case helpers below, or open the console to use <code>siFunciona</code>
        directly.</p>

    <div class="demo">
        <h2>String case conversion</h2>
        <label for="case-input">Type something</label>
        <input id="case-input" type="text" value="some-kabob-case example" autocomplete="off">
        <div class="output">
            <pre id="case-output"></pre>
        </div>
    </div>
</div>
<script type="module">
  const { camelCase, kabobCase, snakeCase, titleCase } = siFunciona
  const input = document.getElementById('case-input')
  const output = document.getElementById('case-output')

  const render = () => {
    const value = input.value
    output.textContent = [
      `camelCase: ${camelCase(value)}`,
      `kabobCase: ${kabobCase(value)}`,
      `snakeCase: ${snakeCase(value)}`,
      `titleCase: ${titleCase(value)}`
    ].join('\n')
  }

  input.addEventListener('input', render)
  window.addEventListener('DOMContentLoaded', () => {
    render()
    console.log(siFunciona, 'Sí, funciona')
  })
</script>
</body>
</html>
